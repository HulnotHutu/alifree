<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百炼免费额度</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #1A2230;
    --muted: #5F6B7A;
    --faint: #98A2B3;
    --line: #E3E7ED;
    --line-soft: #EEF1F5;
    --accent: #E05200;       /* 百炼橙，只用于交互与选中态 */
    --accent-ink: #B54100;
    --accent-tint: #FDEDE2;
    --ok: #0E9F6E;
    --warn: #DD8E00;
    --bad: #E5484D;
    --bad-tint: #FDECEC;
    --warn-tint: #FFF7E0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC",
          "Microsoft YaHei", sans-serif;
  }
  .mono, td.mono, .pctx {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas,
                 "Noto Sans Mono", monospace;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 32px; }

  /* ---- 头部 ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; padding: 18px 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 11px; height: 11px; border-radius: 2px; background: var(--accent); }
  h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .01em; }
  .fresh { display: flex; align-items: center; gap: 12px; }
  .freshness { font-size: 13px; color: var(--muted); }
  .freshness.stale { color: var(--accent-ink); font-weight: 550; }

  button { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 7px 16px; font-size: 14px; font-weight: 550; cursor: pointer;
  }
  .btn:hover { background: #C94A00; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn .spin {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    display: none;
  }
  .btn.loading .spin { display: inline-block; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  :is(button, input):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---- 横幅 ---- */
  .banner {
    margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13.5px;
  }
  .banner.warn  { background: var(--warn-tint); border: 1px solid #F0DFA8; color: #7A5B00; }
  .banner.error { background: var(--bad-tint);  border: 1px solid #F5C2C2; color: #A03030; }
  .banner code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px;
    background: rgba(0,0,0,.05); border-radius: 4px; padding: 1px 5px;
  }

  /* ---- 统计条（可点筛选） ---- */
  .stats { display: flex; flex-wrap: wrap; padding: 6px 0 2px; }
  .stat {
    background: none; border: 0; text-align: left; cursor: pointer;
    padding: 12px 28px 10px 0; margin-right: 28px;
    border-bottom: 2px solid transparent;
  }
  .stat + .stat { border-left: 1px solid var(--line); padding-left: 28px; }
  .stat b {
    display: block; font-size: 26px; font-weight: 650; line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .stat[aria-pressed="true"] { border-bottom-color: var(--accent); }
  .stat[aria-pressed="true"] span { color: var(--accent-ink); }
  .stat.warn-count b { color: var(--warn); }
  .stat.bad-count b  { color: var(--bad); }

  /* ---- 工具条 ---- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 14px 0 10px;
  }
  #search {
    width: 230px; padding: 7px 11px; font: inherit; font-size: 14px;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px;
  }
  #search::placeholder { color: var(--faint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 3.5px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .chip:hover { border-color: var(--faint); color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--accent-tint); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 550;
  }
  .chip small { color: inherit; opacity: .65; font-size: 11.5px; margin-left: 3px; }
  .count { margin-left: auto; font-size: 13px; color: var(--muted); }

  /* ---- 表格 ---- */
  .tableWrap { overflow-x: auto; background: var(--surface);
               border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; min-width: 780px; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12.5px; font-weight: 550; color: var(--muted);
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    white-space: nowrap; user-select: none;
  }
  th.num, td.num { text-align: right; }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--ink); }
  th.sortable::after { content: "↕"; margin-left: 5px; color: var(--faint); font-size: 11px; }
  th.sort-asc  { color: var(--accent-ink); }
  th.sort-asc::after  { content: "↑"; color: var(--accent-ink); }
  th.sort-desc { color: var(--accent-ink); }
  th.sort-desc::after { content: "↓"; color: var(--accent-ink); }

  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  tbody tr:last-child td { border-bottom: 0; }
  td.model { font-size: 13px; }
  tr.expired td { color: var(--faint); }
  tr.expired td.model { text-decoration: none; }

  .type { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #98A2B3); }

  td.num { font-size: 13px; white-space: nowrap; }
  td.num.dim { color: var(--muted); }

  .pct { display: flex; align-items: center; gap: 9px; }
  .bar { flex: 0 0 130px; height: 6px; border-radius: 3px; background: #E9EDF2; overflow: hidden; }
  .fill { display: block; height: 100%; border-radius: 3px; }
  .fill.ok   { background: var(--ok); }
  .fill.warn { background: var(--warn); }
  .fill.bad  { background: var(--bad); }
  .fill.dead { background: var(--faint); }
  .pctx { font-size: 12.5px; color: var(--muted); min-width: 46px; text-align: right; }

  td.expiry { white-space: nowrap; font-size: 13.5px; }
  .rel { margin-left: 7px; font-size: 12.5px; color: var(--muted); }
  .rel.soon { color: var(--bad); font-weight: 550; }
  .rel.warn30 { color: var(--warn); }

  /* ---- 图表区 ---- */
  .chartHead {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding-bottom: 8px;
  }
  .chartHead h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .charts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .charts.collapsed { display: none; }
  .chart-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px 6px; min-width: 0;
  }
  .chart-card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 550; color: var(--muted); }
  .chart { width: 100%; height: 300px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }

  /* ---- 分页 ---- */
  .chartScope { font-size: 12.5px; font-weight: 450; color: var(--faint); margin-left: 6px; }
  .pager {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--line-soft);
    font-size: 13px; color: var(--muted);
  }
  .pager:empty { display: none; }
  .pgBtn {
    min-width: 30px; height: 28px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .pgBtn:hover:not(:disabled):not(.active) { border-color: var(--faint); }
  .pgBtn:disabled { opacity: .45; cursor: default; }
  .pgBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  .pgBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pager select {
    font: inherit; font-size: 13px; padding: 3px 6px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  .pager .spacer { flex: 1; }
  .pager .ellipsis { padding: 0 2px; }

  /* ---- 空态 / 加载 / 页脚 ---- */
  .placeholder { padding: 56px 20px; text-align: center; color: var(--muted); }
  .placeholder .big { font-size: 15.5px; color: var(--ink); margin-bottom: 6px; }
  .placeholder button {
    background: none; border: 0; color: var(--accent-ink); cursor: pointer;
    padding: 0; font-size: inherit; text-decoration: underline; text-underline-offset: 3px;
  }
  footer {
    margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--faint); line-height: 1.8;
  }
  footer code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11.5px;
  }

  @media (max-width: 720px) {
    .stat { padding-right: 18px; margin-right: 18px; }
    .stat + .stat { padding-left: 18px; }
    .stat b { font-size: 22px; }
    .count { flex-basis: 100%; margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.loading .spin { animation: none; border-top-color: rgba(255,255,255,.9); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>百炼免费额度</h1>
    </div>
    <div class="fresh">
      <span class="freshness" id="freshness">加载中…</span>
      <button class="btn" id="refreshBtn" type="button">
        <span class="spin" aria-hidden="true"></span>刷新
      </button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <section class="stats" id="stats" hidden></section>

  <section class="toolbar" hidden id="toolbar">
    <input id="search" type="search" placeholder="搜索模型…" aria-label="搜索模型">
    <div class="chips" id="chips" role="group" aria-label="按类型筛选"></div>
    <span class="count" id="count"></span>
  </section>

  <div class="chartHead" id="chartHead" hidden>
    <h2>可视化 <span class="chartScope" id="chartScope"></span></h2>
    <button class="chip" id="toggleCharts" type="button" aria-pressed="true">收起图表</button>
  </div>
  <section class="charts" id="charts" hidden>
    <div class="chart-card"><h3>各类型剩余额度</h3><div class="chart" id="chartType"></div></div>
    <div class="chart-card"><h3>到期时间分布</h3><div class="chart" id="chartExpiry"></div></div>
    <div class="chart-card"><h3>剩余比例分布</h3><div class="chart" id="chartRatio"></div></div>
    <div class="chart-card"><h3>快照历史趋势</h3><div class="chart" id="chartHistory"></div></div>
  </section>

  <div class="tableWrap" id="tableWrap" hidden>
    <table>
      <thead><tr>
        <th class="sortable" data-key="model" scope="col">模型</th>
        <th scope="col">类型</th>
        <th class="sortable num" data-key="remaining" scope="col">剩余</th>
        <th class="sortable num" data-key="total" scope="col">总量</th>
        <th class="sortable" data-key="pct" scope="col">剩余比例</th>
        <th class="sortable" data-key="days" scope="col">到期</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>

  <div class="placeholder" id="placeholder">加载中…</div>

  <footer>
    <div>数值为抓取时点的快照，到期日按本机时间计算。</div>
    <div id="footMeta">数据库：—</div>
    <div>刷新需要 <code>~/.config/bailian-quota.env</code> 中的阿里云 AK/SK（见 README「免费额度查询」）。</div>
  </footer>

</div>

<script src="/static/echarts.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const TYPE_COLORS = {
    "Text": "#2E90FA", "Vision": "#875BF7", "Audio": "#EE46BC",
    "Embedding": "#12B5A2", "Multimodal": "#F79009", "-": "#98A2B3",
  };
  const TYPE_LABEL = { "-": "其他" };
  const typeLabel = t => TYPE_LABEL[t] || t;
  const QUICK = {
    "可用":   r => !r.expired,
    "即将到期": r => !r.expired && r.days !== null && r.days <= 7,
    "已过期": r => r.expired,
    "全部":   () => true,
  };
  const DEFAULT_SORT = { model: 1, remaining: -1, total: -1, pct: 1, days: 1 };

  const state = {
    data: null, meta: null, types: [], history: null,
    q: "", type: "全部", quick: "可用",
    sortKey: "pct", sortDir: 1, chartsCollapsed: false,
    page: 1, pageSize: 20,
  };

  // --- 数据整形 ------------------------------------------------------------
  function derive(rows) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (const r of rows) {
      r.remaining = Number(r.remaining) || 0;
      r.total = Number(r.total) || 0;
      r.pct = (typeof r.remainingPercent === "number")
        ? r.remainingPercent
        : (r.total ? r.remaining / r.total * 100 : 0);
      r.days = null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(r.expires || "")) {
        const [y, m, d] = r.expires.split("-").map(Number);
        r.days = Math.round((new Date(y, m - 1, d) - today) / 864e5);
      }
      r.expired = r.days !== null && r.days < 0;
    }
    const byType = {};
    for (const r of rows) byType[r.type || "-"] = (byType[r.type || "-"] || 0) + 1;
    state.types = Object.keys(byType)
      .sort((a, b) => byType[b] - byType[a] || a.localeCompare(b));
  }

  function fmtNum(v) {
    v = Math.round(Number(v) || 0);
    if (v >= 1e6 && v % 1e5 === 0) return (v / 1e6) + "M";
    if (v >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(v);
  }

  // --- 渲染 ----------------------------------------------------------------
  function showBanner(kind, html) {
    const el = $("#banner");
    el.hidden = !kind;
    if (kind) { el.className = "banner " + kind; el.innerHTML = html; }
  }

  function renderStats() {
    const rows = state.data.models;
    const counts = {
      "可用":   rows.filter(QUICK["可用"]).length,
      "即将到期": rows.filter(QUICK["即将到期"]).length,
      "已过期": rows.filter(QUICK["已过期"]).length,
      "全部":   rows.length,
    };
    $("#stats").innerHTML = Object.entries(counts).map(([k, n]) => `
      <button class="stat ${k === "即将到期" ? "warn-count" : ""}${k === "已过期" ? " bad-count" : ""}"
              type="button" data-quick="${k}" aria-pressed="${state.quick === k}">
        <b>${n}</b><span>${k}</span>
      </button>`).join("");
  }

  function renderChips() {
    const all = ["全部", ...state.types];
    $("#chips").innerHTML = all.map(t => {
      const n = t === "全部" ? state.data.models.length
        : state.data.models.filter(r => (r.type || "-") === t).length;
      return `<button class="chip" type="button" data-type="${esc(t)}"
                aria-pressed="${state.type === t}">${esc(typeLabel(t))}<small>${n}</small></button>`;
    }).join("");
  }

  function barClass(r) {
    if (r.expired) return "dead";
    if (r.pct >= 50) return "ok";
    if (r.pct >= 20) return "warn";
    return "bad";
  }

  function expiryHtml(r) {
    if (r.days === null) return `<span class="rel">—</span>`;
    if (r.days > 730) return `${esc(r.expires)}<span class="rel">长期有效</span>`;
    if (r.expired) return `<span class="rel soon">已过期 ${-r.days} 天</span>`;
    let rel, cls = "";
    if (r.days === 0) { rel = "今天到期"; cls = "soon"; }
    else if (r.days === 1) { rel = "明天到期"; cls = "soon"; }
    else {
      rel = `${r.days} 天后`;
      cls = r.days <= 7 ? "soon" : (r.days <= 30 ? "warn30" : "");
    }
    return `${esc(r.expires)}<span class="rel ${cls}">${rel}</span>`;
  }

  function currentRows() {
    const q = state.q, f = QUICK[state.quick];
    const rows = state.data.models.filter(r =>
      f(r) && (state.type === "全部" || (r.type || "-") === state.type) &&
      (!q || r.model.toLowerCase().includes(q)));
    const val = {
      model: r => r.model,
      remaining: r => r.remaining,
      total: r => r.total,
      pct: r => r.pct,
      days: r => r.expired ? 1e9 : (r.days === null ? 1e8 : r.days),
    };
    const k = state.sortKey, d = state.sortDir;
    rows.sort((a, b) => {
      const va = val[k](a), vb = val[k](b);
      const c = typeof va === "string" ? va.localeCompare(vb) : va - vb;
      return (c * d) || a.model.localeCompare(b.model);
    });
    return rows;
  }

  function renderTable() {
    const all = currentRows();
    const totalPages = Math.max(1, Math.ceil(all.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * state.pageSize;
    const rows = all.slice(start, start + state.pageSize);

    $("#rows").innerHTML = rows.map(r => `
      <tr class="${r.expired ? "expired" : ""}">
        <td class="mono model">${esc(r.model)}</td>
        <td><span class="type"><i class="dot" style="--c:${TYPE_COLORS[r.type || "-"] || TYPE_COLORS["-"]}"></i>${esc(typeLabel(r.type || "-"))}</span></td>
        <td class="num mono">${fmtNum(r.remaining)}</td>
        <td class="num mono dim">${fmtNum(r.total)}</td>
        <td><div class="pct">
          <span class="bar"><span class="fill ${barClass(r)}" style="width:${Math.min(Math.max(r.pct, 0), 100)}%"></span></span>
          <span class="pctx">${r.pct.toFixed(1)}%</span>
        </div></td>
        <td class="expiry">${expiryHtml(r)}</td>
      </tr>`).join("");
    $("#count").textContent = `显示 ${all.length} / ${state.data.models.length} 个模型`;
    renderPager(all.length, totalPages);
    $("#tableWrap").hidden = all.length === 0;
    $("#placeholder").hidden = all.length > 0;
    if (all.length === 0) {
      $("#placeholder").innerHTML =
        `<div class="big">没有匹配的模型</div>
         <div>换个关键词，或 <button type="button" id="clearBtn">清除筛选</button></div>`;
    }
  }

  function renderPager(total, totalPages) {
    const pager = $("#pager");
    if (total === 0) { pager.innerHTML = ""; return; }
    const nums = [];
    let last = 0;
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - state.page) <= 1) {
        if (p - last > 1) nums.push("…");
        nums.push(p);
        last = p;
      }
    }
    const from = (state.page - 1) * state.pageSize + 1;
    const to = Math.min(total, state.page * state.pageSize);
    pager.innerHTML =
      `<span>共 ${total} 条 · 第 ${state.page}/${totalPages} 页（${from}–${to}）</span>` +
      `<button class="pgBtn" type="button" data-page="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""} aria-label="上一页">‹</button>` +
      nums.map(p => p === "…"
        ? `<span class="ellipsis">…</span>`
        : `<button class="pgBtn ${p === state.page ? "active" : ""}" type="button" data-page="${p}"
             ${p === state.page ? 'aria-current="page"' : ""}>${p}</button>`).join("") +
      `<button class="pgBtn" type="button" data-page="${state.page + 1}" ${state.page >= totalPages ? "disabled" : ""} aria-label="下一页">›</button>` +
      `<span class="spacer"></span>` +
      `<label>每页 <select id="pageSize" aria-label="每页条数">` +
        [20, 50, 100].map(n => `<option value="${n}" ${n === state.pageSize ? "selected" : ""}>${n}</option>`).join("") +
      `</select> 条</label>`;
  }

  function renderSortHeads() {
    document.querySelectorAll("th.sortable").forEach(th => {
      th.classList.remove("sort-asc", "sort-desc");
      th.removeAttribute("aria-sort");
      if (th.dataset.key === state.sortKey) {
        const cls = state.sortDir === 1 ? "sort-asc" : "sort-desc";
        th.classList.add(cls);
        th.setAttribute("aria-sort", state.sortDir === 1 ? "ascending" : "descending");
      }
    });
  }

  function renderAll() {
    renderStats(); renderChips(); renderTable(); renderSortHeads(); renderCharts();
    $("#stats").hidden = false; $("#toolbar").hidden = false;
    $("#chartHead").hidden = false; $("#charts").hidden = state.chartsCollapsed;
  }

  function renderFreshness() {
    if (!state.meta) return;
    const el = $("#freshness");
    const age = state.meta.ageHours;
    const when = (state.data.fetched_at || "").slice(0, 16).replace("T", " ");
    let label = "";
    if (typeof age === "number") {
      label = age < 1 ? "刚刚更新"
        : age < 24 ? `${Math.round(age)} 小时前`
        : `${Math.round(age / 24)} 天前`;
      label = `（${label}）`;
    }
    el.textContent = `快照：${when}${label}`;
    el.classList.toggle("stale", typeof age === "number" && age >= 48);
    if (typeof age === "number" && age >= 48) {
      showBanner("warn",
        `快照已 ${Math.round(age / 24)} 天未更新，数值可能过期。` +
        `配置 <code>~/.config/bailian-quota.env</code> 后可点右上角刷新。`);
    }
    $("#footMeta").textContent =
      `数据库：${state.meta.db || "—"}` +
      (state.meta.snapshotId ? `（快照 #${state.meta.snapshotId}）` : "") +
      `；接口：/api/quota（JSON）、POST /api/refresh`;
  }

  // --- 图表 ------------------------------------------------------------------
  const charts = {};
  const AXIS = { color: "#5F6B7A" };
  const SPLIT = { lineStyle: { color: "#EEF1F5" } };

  function chart(id, opt) {
    const el = document.getElementById(id);
    if (!el || typeof echarts === "undefined") return;
    if (!charts[id]) charts[id] = echarts.init(el);
    charts[id].setOption({
      animationDuration: 300,
      textStyle: { fontFamily: "inherit" },
      ...opt,
    }, true);
  }

  function expiryBucket(r) {
    if (r.days === null) return "长期/未知";
    if (r.days < 0) return "已过期";
    if (r.days <= 7) return "7 天内到期";
    if (r.days <= 30) return "8–30 天";
    if (r.days <= 90) return "31–90 天";
    if (r.days > 730) return "长期有效";
    return "90 天以上";
  }

  function renderCharts() {
    // 图表跟随当前筛选视图（与下方表格同源），历史趋势图除外
    const rows = currentRows();
    if (!state.data || typeof echarts === "undefined") return;

    $("#chartScope").textContent =
      `当前视图：${state.quick} · ${state.type === "全部" ? "全部类型" : typeLabel(state.type)}` +
      (state.q ? ` · 关键词“${state.q}”` : "") + ` · ${rows.length} 个模型`;
    const empty = rows.length === 0;
    const emptyMark = empty
      ? [{ type: "text", left: "center", top: "middle",
           style: { text: "当前筛选无模型", fill: "#98A2B3", fontSize: 13 } }]
      : [];

    // 1. 各类型剩余额度
    const byType = {};
    for (const r of rows) {
      const t = r.type || "-";
      byType[t] = byType[t] || { rem: 0, n: 0 };
      byType[t].rem += r.remaining;
      byType[t].n++;
    }
    const types = Object.keys(byType).sort((a, b) => byType[b].rem - byType[a].rem);
    chart("chartType", {
      grid: { left: 8, right: 16, top: 30, bottom: 0, containLabel: true },
      graphic: emptyMark,
      tooltip: {
        trigger: "axis",
        formatter: ps => ps.map(p =>
          `${p.name}：${fmtNum(p.value)}（${byType[p.name].n} 个模型）`).join("<br>"),
      },
      xAxis: { type: "category", data: types, axisLabel: { ...AXIS, interval: 0 }, axisLine: { lineStyle: { color: "#E3E7ED" } } },
      yAxis: { type: "value", axisLabel: { ...AXIS, formatter: fmtNum }, splitLine: SPLIT },
      series: [{
        type: "bar", barMaxWidth: 42,
        data: types.map(t => ({ value: Math.round(byType[t].rem), itemStyle: { color: TYPE_COLORS[t] || TYPE_COLORS["-"] } })),
        label: { show: true, position: "top", color: AXIS.color, formatter: p => fmtNum(p.value) },
      }],
    });

    // 2. 到期时间分布
    const order = ["已过期", "7 天内到期", "8–30 天", "31–90 天", "90 天以上", "长期有效", "长期/未知"];
    const colors = { "已过期": "#E5484D", "7 天内到期": "#E05200", "8–30 天": "#DD8E00",
                     "31–90 天": "#2E90FA", "90 天以上": "#12B5A2", "长期有效": "#667085", "长期/未知": "#98A2B3" };
    const counts = {};
    for (const r of rows) counts[expiryBucket(r)] = (counts[expiryBucket(r)] || 0) + 1;
    chart("chartExpiry", {
      graphic: emptyMark,
      tooltip: { trigger: "item", formatter: "{b}：{c} 个（{d}%）" },
      legend: { bottom: 0, textStyle: AXIS, itemWidth: 12, itemHeight: 8 },
      series: [{
        type: "pie", radius: ["42%", "68%"], center: ["50%", "44%"],
        label: { show: true, formatter: "{b} {c}", color: AXIS.color },
        labelLine: { lineStyle: { color: "#E3E7ED" } },
        data: order.filter(k => counts[k]).map(k => ({
          name: k, value: counts[k], itemStyle: { color: colors[k] },
        })),
      }],
    });

    // 3. 剩余比例分布
    const bins = [["0–10%", 0, 10], ["10–25%", 10, 25], ["25–50%", 25, 50],
                  ["50–75%", 50, 75], ["75–99%", 75, 100], ["100%（未使用）", 100, 101]];
    const binCounts = bins.map(() => 0);
    for (const r of rows) {
      const p = r.pct;
      let i = bins.findIndex(([, lo, hi]) => p >= lo && p < hi);
      if (i < 0) i = bins.length - 1;
      binCounts[i]++;
    }
    const binColors = ["#E5484D", "#E5484D", "#DD8E00", "#DD8E00", "#0E9F6E", "#0E9F6E"];
    chart("chartRatio", {
      grid: { left: 8, right: 16, top: 30, bottom: 0, containLabel: true },
      graphic: emptyMark,
      tooltip: { trigger: "axis", formatter: ps => ps.map(p => `${p.name}：${p.value} 个模型`).join("<br>") },
      xAxis: { type: "category", data: bins.map(b => b[0]), axisLabel: { ...AXIS, interval: 0 }, axisLine: { lineStyle: { color: "#E3E7ED" } } },
      yAxis: { type: "value", minInterval: 1, axisLabel: AXIS, splitLine: SPLIT },
      series: [{
        type: "bar", barMaxWidth: 42,
        data: binCounts.map((v, i) => ({ value: v, itemStyle: { color: binColors[i] } })),
        label: { show: true, position: "top", color: AXIS.color },
      }],
    });

    // 4. 快照历史趋势（跨快照的全局视图，不随筛选变化）
    renderHistoryChart();
  }

  function loadHistory() {
    return fetch("/api/history").then(r => r.json()).then(runs => {
      state.history = Array.isArray(runs) ? runs : [];
      renderHistoryChart();
    }).catch(() => {});
  }

  function renderHistoryChart() {
    const runs = state.history;
    if (!Array.isArray(runs) || !runs.length) return;
    const asc = [...runs].sort((a, b) => a.id - b.id);
    chart("chartHistory", {
      grid: { left: 8, right: 16, top: 36, bottom: 0, containLabel: true },
      tooltip: { trigger: "axis" },
      legend: { top: 0, textStyle: AXIS, itemWidth: 14, itemHeight: 8 },
      xAxis: { type: "category", boundaryGap: false,
               data: asc.map(r => r.fetchedAt.slice(0, 16).replace("T", " ")),
               axisLabel: { ...AXIS, hideOverlap: true }, axisLine: { lineStyle: { color: "#E3E7ED" } } },
      yAxis: { type: "value", axisLabel: AXIS, splitLine: SPLIT },
      series: [
        { name: "有额度模型", type: "line", smooth: true, symbolSize: 6,
          data: asc.map(r => r.withQuota), itemStyle: { color: "#E05200" },
          areaStyle: { color: "rgba(224,82,0,.08)" } },
        { name: "查询到的模型总数", type: "line", smooth: true, symbolSize: 6,
          data: asc.map(r => r.totalModels), itemStyle: { color: "#2E90FA" }, lineStyle: { type: "dashed" } },
      ],
    });
  }

  // --- 交互 ----------------------------------------------------------------
  $("#stats").addEventListener("click", e => {
    const btn = e.target.closest("[data-quick]");
    if (!btn) return;
    state.quick = btn.dataset.quick;
    state.page = 1;
    renderStats(); renderTable(); renderCharts();
  });

  $("#chips").addEventListener("click", e => {
    const btn = e.target.closest("[data-type]");
    if (!btn) return;
    state.type = btn.dataset.type;
    state.page = 1;
    renderChips(); renderTable(); renderCharts();
  });

  $("#search").addEventListener("input", e => {
    state.q = e.target.value.trim().toLowerCase();
    state.page = 1;
    renderTable(); renderCharts();
  });

  document.querySelector("thead").addEventListener("click", e => {
    const th = e.target.closest("th.sortable");
    if (!th) return;
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir = -state.sortDir;
    else { state.sortKey = key; state.sortDir = DEFAULT_SORT[key] || 1; }
    state.page = 1;
    renderSortHeads(); renderTable();
  });

  $("#pager").addEventListener("click", e => {
    const b = e.target.closest("[data-page]");
    if (!b || b.disabled) return;
    state.page = Number(b.dataset.page);
    renderTable();
  });

  $("#pager").addEventListener("change", e => {
    if (e.target.id !== "pageSize") return;
    state.pageSize = Number(e.target.value);
    state.page = 1;
    renderTable();
  });

  $("#placeholder").addEventListener("click", e => {
    if (e.target.id !== "clearBtn") return;
    state.q = ""; state.type = "全部"; state.quick = "可用";
    $("#search").value = "";
    renderAll();
  });

  $("#toggleCharts").addEventListener("click", e => {
    state.chartsCollapsed = !state.chartsCollapsed;
    e.target.textContent = state.chartsCollapsed ? "展开图表" : "收起图表";
    e.target.setAttribute("aria-pressed", String(!state.chartsCollapsed));
    $("#charts").classList.toggle("collapsed", state.chartsCollapsed);
    if (!state.chartsCollapsed) {
      // 从 display:none 恢复后 ECharts 需要重新测量
      Object.values(charts).forEach(c => c.resize());
    }
  });

  window.addEventListener("resize", () => Object.values(charts).forEach(c => c.resize()));

  $("#refreshBtn").addEventListener("click", async () => {
    const btn = $("#refreshBtn");
    btn.disabled = true; btn.classList.add("loading");
    try {
      const res = await fetch("/api/refresh", { method: "POST" });
      const out = await res.json();
      if (out.ok) {
        state.data = out.data; state.meta = out.meta;
        state.page = 1;
        derive(state.data.models);
        renderAll(); renderFreshness(); loadHistory();
        showBanner(null);
      } else {
        showBanner("error", esc(out.error || "刷新失败"));
      }
    } catch (err) {
      showBanner("error", "刷新请求失败：" + esc(err.message));
    } finally {
      btn.disabled = false; btn.classList.remove("loading");
    }
  });

  // --- 启动 ----------------------------------------------------------------
  (async () => {
    try {
      const res = await fetch("/api/quota");
      const out = await res.json();
      if (!out.ok) {
        $("#freshness").textContent = "无数据";
        $("#placeholder").innerHTML =
          `<div class="big">还没有可展示的额度数据</div><div>${esc(out.error || "")}</div>`;
        return;
      }
      state.data = out.data; state.meta = out.meta;
      derive(state.data.models);
      renderAll(); renderFreshness(); loadHistory();
    } catch (err) {
      $("#placeholder").innerHTML =
        `<div class="big">加载失败</div><div>${esc(err.message)}</div>`;
    }
  })();
})();
</script>
</body>
</html>
